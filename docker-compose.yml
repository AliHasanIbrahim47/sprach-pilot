# Local backing services for SprachPilot (SP-007).
# Apps (web/api/worker) run on the host — only infrastructure is containerized here.
#
# Object storage uses SeaweedFS (S3-compatible). MinIO Hub/Quay images are no longer
# anonymously pullable as of 2026-09.
#
# Usage:
#   pnpm infra:up
#   pnpm infra:down
#   pnpm infra:reset
#   pnpm infra:up -- --profile observability
#   pnpm infra:up -- --profile clamav

name: sprachpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: sprachpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprachpilot
      POSTGRES_PASSWORD: sprachpilot
      POSTGRES_DB: sprachpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprachpilot -d sprachpilot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sprachpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: sprachpilot-seaweedfs
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=100
      - -volume.max=100
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumePreallocate=false
    ports:
      - "9000:8333" # S3 API (MinIO-compatible local port)
      - "9333:9333" # master (debug / weed shell)
      - "8888:8888" # filer (bucket admin)
    volumes:
      - seaweedfs_data:/data
      - ./infra/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  seaweedfs-init:
    image: chrislusf/seaweedfs:3.97
    profiles: ["init"]
    container_name: sprachpilot-seaweedfs-init
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/create-bucket.sh"]
    volumes:
      - ./infra/docker/seaweedfs/create-bucket.sh:/scripts/create-bucket.sh:ro,Z
    environment:
      WEED_MASTER: seaweedfs:9333
      WEED_FILER: seaweedfs:8888
      S3_BUCKET: sprachpilot-dev

  mailpit:
    image: axllent/mailpit:v1.27.10
    container_name: sprachpilot-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    container_name: sprachpilot-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: sprachpilot-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    container_name: sprachpilot-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3002:3000" # avoid clash with Next.js on :3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  clamav_data:
  prometheus_data:
  grafana_data:
