global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API metrics land in SP-074; placeholder keeps Grafana/Prometheus wired locally.
  - job_name: sprachpilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
